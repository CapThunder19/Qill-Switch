name: challenge-pages
# Publishes the "Steal This Agent" page (apps/challenge) to GitHub Pages.
# Manual on purpose: run it from the Actions tab on launch day.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: challenge-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --filter @qill/challenge... --no-frozen-lockfile
      - run: pnpm --filter @qill/challenge build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/challenge/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
