[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/vectors" }]
gas_reports = ["QillVault"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
